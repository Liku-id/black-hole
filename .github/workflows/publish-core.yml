name: Publish Core

on:
  workflow_call:
    inputs:
      target_branch:
        required: true
        type: string
        description: "Target branch to build and push (main or develop)"
      custom_tag:
        required: false
        type: string
        description: "Optional custom image tag. If empty, short SHA is used."
      reason:
        required: false
        type: string
        description: "Optional reason or notes (replaces PR title in dispatch)"
      pr_url:
        required: false
        type: string
        description: "Optional PR URL (replaces PR URL in dispatch)"

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    
    steps:
      - name: Configure git to use HTTPS instead of SSH
        run: |
          git config --global url."https://github.com/".insteadOf "git@github.com:"

      - name: Checkout repository and submodules
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_branch }}
          submodules: 'recursive'
          fetch-depth: 0
          token: ${{ secrets.WUKONG_PAT }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Tentukan env + nama image dari branch tujuan PR / target branch:
      #   develop -> staging -> <user>/black-hole-stag
      #   main    -> prod    -> <user>/black-hole
      - name: Resolve env, image name, tag, title and url
        id: vars
        env:
          INPUT_TARGET_BRANCH: ${{ inputs.target_branch }}
          INPUT_CUSTOM_TAG: ${{ inputs.custom_tag }}
          INPUT_REASON: ${{ inputs.reason }}
          INPUT_PR_URL: ${{ inputs.pr_url }}
        run: |
          sha_short=$(git rev-parse --short HEAD)
          
          if [ "$INPUT_TARGET_BRANCH" = "main" ]; then
            echo "env=prod" >> "$GITHUB_OUTPUT"
            echo "image=${{ secrets.DOCKERHUB_USERNAME }}/black-hole" >> "$GITHUB_OUTPUT"
          else
            echo "env=staging" >> "$GITHUB_OUTPUT"
            echo "image=${{ secrets.DOCKERHUB_USERNAME }}/black-hole-stag" >> "$GITHUB_OUTPUT"
          fi
          
          if [ -n "$INPUT_CUSTOM_TAG" ]; then
            echo "tag=$INPUT_CUSTOM_TAG" >> "$GITHUB_OUTPUT"
          else
            echo "tag=$sha_short" >> "$GITHUB_OUTPUT"
          fi
          
          if [ -n "$INPUT_REASON" ]; then
            echo "title=$INPUT_REASON" >> "$GITHUB_OUTPUT"
          else
            echo "title=No details provided" >> "$GITHUB_OUTPUT"
          fi
          
          if [ -n "$INPUT_PR_URL" ]; then
            echo "url=$INPUT_PR_URL" >> "$GITHUB_OUTPUT"
          else
            echo "url=https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./staging.dockerfile
          push: true
          tags: ${{ steps.vars.outputs.image }}:${{ steps.vars.outputs.tag }}

      - name: Trigger deploy on byteplus-infra
        run: |
          payload=$(jq -nc \
            --arg env "${{ steps.vars.outputs.env }}" \
            --arg tag "${{ steps.vars.outputs.tag }}" \
            --arg actor "${{ github.actor }}" \
            --arg pr_title "${{ steps.vars.outputs.title }}" \
            --arg pr_url "${{ steps.vars.outputs.url }}" \
            '{event_type:"image-pushed", client_payload:{service:"black-hole", env:$env, tag:$tag, actor:$actor, pr_title:$pr_title, pr_url:$pr_url}}')
          curl -sf -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.EKUID_K8S_DISPATCH_TOKEN }}" \
            https://api.github.com/repos/Liku-id/byteplus-infra/dispatches \
            -d "$payload"
